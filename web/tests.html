<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>提示词测试 · lang-helper</title>
<script src="js/theme.js"></script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/tests-page.js"></script>
</head>
<body>
<main class="t-wrap view">
  <div class="t-head">
    <a href="./" class="back">← 返回</a>
    <h1>提示词测试</h1>
    <span class="hint">提示词版本 <span id="pver"></span> · 用设置页里的 key 和模型</span>
  </div>
  <div class="card bar">
    <label class="toggle"><input type="checkbox" data-mode="ja" checked>写日语 <span class="hint" data-count="ja"></span></label>
    <label class="toggle"><input type="checkbox" data-mode="zh" checked>转中文 <span class="hint" data-count="zh"></span></label>
    <label class="toggle"><input type="checkbox" data-mode="en" checked>写英文 <span class="hint" data-count="en"></span></label>
    <span class="spacer"></span>
    <span class="hint" id="progress"></span>
    <button type="button" class="btn" id="export">导出结果</button>
    <button type="button" class="btn primary" id="run">运行</button>
  </div>
  <p class="hint">黄框 = 和上一次运行的结果不同；红底 = 标注了「应原样返回」却被改了。测试用例在 <code>web/tests/cases.json</code>，可以随时加你自己的句子。</p>
  <div id="results"></div>
</main>
</body>
</html>
