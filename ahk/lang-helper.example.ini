; lang-helper PC 弹窗设置。第一次运行时会复制成 lang-helper.ini，改那个文件即可（改完在托盘菜单里点「重新加载」）。

[Popup]
; 网页的地址（以 / 结尾），弹窗会打开这里的 popup.html。
; 部署到 GitHub Pages 之前用本地服务器（要先运行 python dev\server.py）：
Url=http://localhost:8787/
; 部署后改成 https://<你的GitHub用户名>.github.io/lang-helper/
; 弹窗大小（像素）。拖动边缘改了大小后会自动记住。
Width=480
Height=640
; 1 = 启动后先在后台把弹窗准备好，按快捷键瞬间出现
Prewarm=1
; 1 = Alt+D / Alt+A 把文字放进弹窗后直接执行；0 = 先停下，你可以改一改再按 Enter
AutoRun=0
; 1 = 点到别的窗口时自动收起弹窗（点弹窗左上角的图钉可以固定）
HideOnBlur=1
; 1 = 在弹窗里复制（Alt+C 或复制按钮）后自动收起
HideAfterCopy=0
; 1 = 把弹窗的每一步记到 ahk\debug.log（排查「弹不出来 / 闪一下就关」用）
Debug=0
; Edge 的位置，留空自动查找
Edge=
; 弹窗用的独立 Edge 配置目录（API key 等设置存在这里，和你平时的 Edge 分开），留空用默认位置
Profile=

[Hotkeys]
; AutoHotkey 写法：! = Alt，^ = Ctrl，+ = Shift，# = Win。留空表示不用这个快捷键。
; 把选中的文字放进弹窗、切到翻译（没选中文字时，按键原样交给当前程序，比如浏览器里 Alt+D 照常跳到地址栏）
translate=!d
; 把选中的文字放进弹窗、切到润色（没选中文字时同上）
polish=!a
; 打开空白弹窗输入（沿用上次用 Shift+Tab 选的「翻译 / 润色」）；弹窗已经在前台时再按一次 = 收起
input=!q
