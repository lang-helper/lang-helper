# 把 web/ 目录部署到 GitHub Pages。
# 仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」后，每次 push 到 main 自动发布。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages 要列出本次运行上传的网页包（github-pages）

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 打包和部署分成两个任务（GitHub 官方模板的写法）。
  # 2026-11-25 写在同一个任务里时连续失败：网页包刚传完一秒就去找，报「No artifacts named "github-pages" were found」。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
