# 把 web/ 目录部署到 GitHub Pages。
# 仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」后，每次 push 到 main 自动发布。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages 要列出本次运行上传的网页包（github-pages）。没有这个权限时会报
  # 「No artifacts named "github-pages" were found」（2026-11-25 同样的配置突然连续失败，加上这个试试）
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
